<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puntos de Red · Trienergy SAS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#11161c; --panel:#171d25; --line:#283340; --line2:#1f2730;
    --canvas:#0d1117; --paper:#eef2f4; --muted:#8a98a6; --dim:#5d6b78;
    --link:#34d399; --link-dim:#155e4a; --amber:#f5a623; --red:#ef5350;
    --txt:#dde5ec; --accent:#34d399;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--canvas);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{padding:0 0 60px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

  /* ── Header ── */
  header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#10151b,#0d1117)}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:26px 20px 22px;max-width:1180px;margin:0 auto;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;gap:4px}
  .ey{font-family:var(--mono);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--link)}
  h1{margin:0;font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1}
  .sub{color:var(--muted);font-size:13px}
  .counts{display:flex;gap:10px;font-family:var(--mono);font-size:12px;color:var(--dim);flex-wrap:wrap}
  .counts b{color:var(--txt);font-weight:700}

  /* ── Search ── */
  .searchbar{position:sticky;top:0;z-index:30;background:rgba(13,17,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 0}
  .sfield{position:relative;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:0 14px;transition:border-color .15s,box-shadow .15s}
  .sfield:focus-within{border-color:var(--link);box-shadow:0 0 0 3px rgba(52,211,153,.13)}
  .sfield svg{flex:0 0 auto;color:var(--dim)}
  #q{flex:1;background:none;border:0;outline:0;color:var(--txt);font-size:16px;padding:15px 0;font-family:var(--sans)}
  #q::placeholder{color:var(--dim)}
  .clear{background:none;border:0;color:var(--dim);cursor:pointer;font-size:20px;padding:6px;line-height:1;display:none}
  .clear:hover{color:var(--txt)}
  .filters{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap;align-items:center}
  .chip{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 13px;cursor:pointer;transition:.13s}
  .chip:hover{color:var(--txt);border-color:var(--dim)}
  .chip.on{background:var(--link-dim);border-color:var(--link);color:#d6fff0}
  .flabel{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-right:2px}
  .spacer{flex:1}

  .btn{font-family:var(--sans);font-size:13.5px;font-weight:600;border-radius:9px;padding:10px 15px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--txt);transition:.13s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .btn:hover{border-color:var(--dim)}
  .btn.primary{background:var(--link);border-color:var(--link);color:#06281d}
  .btn.primary:hover{background:#46e0a8}
  .btn.ghost{background:transparent}

  /* ── Results ── */
  .meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 12px;flex-wrap:wrap}
  .resn{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .resn b{color:var(--link)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:13px}
  .card{background:var(--panel);border:1px solid var(--line2);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .13s,transform .13s}
  .card:hover{border-color:var(--dim);transform:translateY(-1px)}
  .ctop{display:flex;align-items:stretch}
  .port{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:74px;padding:12px 10px;background:var(--ink);border-right:1px solid var(--line2)}
  .port .pl{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
  .port .pn{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1;color:var(--link)}
  .port .sw{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px}
  .cbody{flex:1;padding:11px 13px;min-width:0}
  .etiq{font-weight:680;font-size:15px;letter-spacing:-.01em;margin:0 0 3px;word-break:break-word}
  .ubic{font-size:13px;color:var(--muted);line-height:1.4;word-break:break-word}
  .cmeta{display:flex;flex-wrap:wrap;gap:6px 10px;padding:9px 13px;border-top:1px solid var(--line2);font-family:var(--mono);font-size:11.5px;color:var(--dim)}
  .cmeta span{display:inline-flex;align-items:center;gap:5px}
  .cmeta b{color:var(--muted);font-weight:600}
  .led{width:8px;height:8px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 6px currentColor}
  .led.ok{color:var(--link);background:var(--link)}
  .led.bad{color:var(--red);background:var(--red)}
  .led.warn{color:var(--amber);background:var(--amber)}
  .led.none{color:var(--dim);background:var(--dim);box-shadow:none}
  .obs{padding:0 13px 11px;font-size:12px;color:var(--amber);line-height:1.4}
  .obs:empty{display:none}
  .cact{display:flex;border-top:1px solid var(--line2)}
  .cact button{flex:1;background:none;border:0;border-right:1px solid var(--line2);color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:8px;cursor:pointer;transition:.12s}
  .cact button:last-child{border-right:0}
  .cact button:hover{background:var(--ink);color:var(--txt)}
  .cact button.del:hover{color:var(--red)}
  mark{background:rgba(245,166,35,.28);color:#ffd98a;border-radius:2px;padding:0 1px}

  .empty{text-align:center;padding:60px 20px;color:var(--dim)}
  .empty .big{font-size:17px;color:var(--muted);margin-bottom:6px}

  /* ── Modal ── */
  .ov{position:fixed;inset:0;background:rgba(5,8,11,.72);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:34px 16px;overflow:auto}
  .ov.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:15px;width:100%;max-width:560px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .mhead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line2)}
  .mhead h3{margin:0;font-size:17px}
  .x{background:none;border:0;color:var(--dim);font-size:24px;cursor:pointer;line-height:1}
  .x:hover{color:var(--txt)}
  .mbody{padding:18px 20px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px}
  .fld{display:flex;flex-direction:column;gap:6px}
  .fld.full{grid-column:1/-1}
  label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  input,select,textarea{background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:10px 11px;font-size:14px;font-family:var(--sans);outline:0;transition:border-color .13s}
  input:focus,select:focus,textarea:focus{border-color:var(--link)}
  textarea{resize:vertical;min-height:54px}
  .mfoot{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--line2)}
  .hint{font-size:12px;color:var(--dim);margin-top:-4px}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--link);color:#06281d;font-weight:600;font-size:14px;padding:12px 20px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;z-index:80}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:560px){
    .head{padding:20px 16px}
    h1{font-size:22px}
    .grid{grid-template-columns:1fr}
    .row{grid-template-columns:1fr}
  }
</style>

<header>
  <div class="head">
    <div class="brand">
      <span class="ey">Listado de puntos de red</span>
      <h1>Trienergy SAS · Switches</h1>
      <span class="sub">Busca un punto, edítalo o agrega nuevos y descarga el Excel actualizado.</span>
    </div>
    <div class="counts" id="counts"></div>
  </div>
</header>

<div class="searchbar">
  <div class="wrap">
    <div class="sfield">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" placeholder="Buscar etiqueta, ubicación, piso, regleta, observación…" autocomplete="off">
      <button class="clear" id="clear">×</button>
    </div>
    <div class="filters">
      <span class="flabel">Switch</span>
      <span id="swfilters"></span>
      <span class="spacer"></span>
      <button class="btn primary" id="addBtn">+ Agregar punto</button>
      <button class="btn" id="exportBtn">⬇ Descargar Excel</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="meta">
    <div class="resn" id="resn"></div>
    <button class="btn ghost" id="resetBtn" style="display:none;font-size:12px;padding:7px 12px">↺ Restaurar datos originales</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- Modal -->
<div class="ov" id="ov">
  <div class="modal">
    <div class="mhead"><h3 id="mtitle">Agregar punto de red</h3><button class="x" id="mclose">×</button></div>
    <div class="mbody">
      <div class="row">
        <div class="fld"><label>Edificio</label><input id="f_edi" placeholder="1"></div>
        <div class="fld"><label>Switch</label><input id="f_sw" placeholder="2"></div>
      </div>
      <div class="row">
        <div class="fld"><label>Puerto</label><input id="f_port" placeholder="7"></div>
        <div class="fld"><label>Estado</label>
          <select id="f_estado">
            <option value="">— sin definir —</option>
            <option>BUENO</option><option>CON FALLA</option><option>REGULAR</option>
          </select>
        </div>
      </div>
      <div class="fld full" style="margin-bottom:13px"><label>Nombre de etiqueta</label><input id="f_etiq" placeholder="DATOS 11 CAJA"></div>
      <div class="fld full" style="margin-bottom:13px"><label>Ubicación física</label><input id="f_ubic" placeholder="CAJA - EN LA PARED AL LADO DEL ESCRITORIO"></div>
      <div class="row">
        <div class="fld"><label>Piso / Área</label><input id="f_piso" placeholder="PISO 1"></div>
        <div class="fld"><label>Ubicación regleta</label><input id="f_reg" placeholder="REGLETA (3) PUERTO (11)"></div>
      </div>
      <div class="fld full"><label>Observaciones</label><textarea id="f_obs" placeholder="NINGUNA"></textarea></div>
    </div>
    <div class="mfoot">
      <button class="btn ghost" id="mcancel">Cancelar</button>
      <button class="btn primary" id="msave">Guardar punto</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const COLS=[["puerto","Puerto"],["ubicacion","Ubicación fisica"],["piso","Piso/Area"],["etiqueta","Nombre de etiqueta"],["regleta","UBICACION REGLETA"],["estado","Estado"],["obs","Observaciones"]];
const $=s=>document.querySelector(s);
let state={records:[],switches:[],activeSw:null,nextId:1,editId:null};

function persist(){ try{ window.storage && window.storage.set('trienergy_red_v1',JSON.stringify({records:state.records,switches:state.switches}),false); }catch(e){} }
async function boot(){
  let saved=null;
  try{ const r=await window.storage.get('trienergy_red_v1',false); if(r&&r.value) saved=JSON.parse(r.value); }catch(e){}
  const src= saved && saved.records ? saved : SEED_DATA;
  state.records=src.records.map(r=>({...r}));
  state.switches=src.switches.map(s=>({...s}));
  state.nextId=Math.max(0,...state.records.map(r=>+r.id||0))+1;
  $('#resetBtn').style.display = saved ? 'inline-flex':'none';
  renderFilters(); render();
}

function swList(){
  const set=new Map();
  state.switches.forEach(s=>set.set(s.switch,s));
  state.records.forEach(r=>{ if(!set.has(r.switch)) set.set(r.switch,{edificio:r.edificio,switch:r.switch,puertos:0}); });
  return [...set.values()].sort((a,b)=>(+a.switch)-(+b.switch));
}

function renderFilters(){
  const c=$('#swfilters'); c.innerHTML='';
  const all=document.createElement('button'); all.className='chip'+(state.activeSw==null?' on':''); all.textContent='Todos';
  all.onclick=()=>{state.activeSw=null;renderFilters();render();}; c.appendChild(all);
  swList().forEach(s=>{
    const b=document.createElement('button'); b.className='chip'+(state.activeSw===s.switch?' on':'');
    b.textContent='SW '+s.switch+' · Ed '+s.edificio;
    b.onclick=()=>{state.activeSw=s.switch;renderFilters();render();}; c.appendChild(b);
  });
}

function ledClass(e){ e=(e||'').toUpperCase(); if(!e)return'none'; if(e.includes('FALLA')||e.includes('MAL'))return'bad'; if(e.includes('REGULAR')||e.includes('REVIS'))return'warn'; return'ok'; }
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function hl(s,q){ s=esc(s); if(!q)return s; const t=q.trim(); if(!t)return s; const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); return s.replace(re,'<mark>$1</mark>'); }

function render(){
  const q=$('#q').value.trim().toLowerCase();
  let list=state.records.slice();
  if(state.activeSw!=null) list=list.filter(r=>r.switch===state.activeSw);
  if(q){ list=list.filter(r=>['ubicacion','piso','etiqueta','regleta','estado','obs','switch','puerto','edificio'].some(k=>String(r[k]||'').toLowerCase().includes(q))); }
  list.sort((a,b)=> (+a.switch-+b.switch) || (+a.puerto-+b.puerto));

  $('#counts').innerHTML=`<span><b>${state.records.length}</b> puntos</span><span><b>${swList().length}</b> switches</span>`;
  const qd=$('#q').value.trim();
  $('#resn').innerHTML = qd ? `<b>${list.length}</b> resultado(s) para “${esc(qd)}”` : `Mostrando <b>${list.length}</b> punto(s)`;
  $('#clear').style.display = qd ? 'block':'none';

  const g=$('#grid');
  if(!list.length){ g.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="big">Sin coincidencias</div>${qd?'No se encontró “'+esc(qd)+'”. Prueba otra palabra o agrégalo como nuevo punto.':'Aún no hay puntos en este switch.'}</div>`; return; }
  g.innerHTML=list.map(r=>{
    const led=ledClass(r.estado);
    return `<div class="card">
      <div class="ctop">
        <div class="port"><span class="pl">Puerto</span><span class="pn">${esc(r.puerto)||'·'}</span><span class="sw">SW ${esc(r.switch)} · Ed ${esc(r.edificio)}</span></div>
        <div class="cbody">
          <p class="etiq">${hl(r.etiqueta||'(sin etiqueta)',q)}</p>
          <div class="ubic">${hl(r.ubicacion||'—',q)}</div>
        </div>
      </div>
      <div class="cmeta">
        <span><b>Piso</b> ${hl(r.piso||'—',q)}</span>
        <span><b>Regleta</b> ${hl(r.regleta||'—',q)}</span>
        <span><span class="led ${led}"></span>${hl(r.estado||'sin estado',q)}</span>
      </div>
      ${r.obs && r.obs.toUpperCase()!=='NINGUNA' ? `<div class="obs">⚠ ${hl(r.obs,q)}</div>`:''}
      <div class="cact"><button data-edit="${r.id}">Editar</button><button class="del" data-del="${r.id}">Eliminar</button></div>
    </div>`;
  }).join('');
  g.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openModal(+b.dataset.edit));
  g.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delRec(+b.dataset.del));
}

/* ── Modal ── */
function openModal(id){
  state.editId=id||null;
  $('#mtitle').textContent= id?'Editar punto de red':'Agregar punto de red';
  const r= id? state.records.find(x=>x.id===id) : null;
  $('#f_edi').value=r?r.edificio:(state.activeSw?(swList().find(s=>s.switch===state.activeSw)||{}).edificio||'':'');
  $('#f_sw').value=r?r.switch:(state.activeSw||'');
  $('#f_port').value=r?r.puerto:''; $('#f_etiq').value=r?r.etiqueta:''; $('#f_ubic').value=r?r.ubicacion:'';
  $('#f_piso').value=r?r.piso:''; $('#f_reg').value=r?r.regleta:''; $('#f_obs').value=r?r.obs:'';
  $('#f_estado').value= r && ['BUENO','CON FALLA','REGULAR'].includes((r.estado||'').toUpperCase())? r.estado.toUpperCase():'';
  $('#ov').classList.add('show'); setTimeout(()=>$('#f_etiq').focus(),50);
}
function closeModal(){ $('#ov').classList.remove('show'); state.editId=null; }
function save(){
  const rec={
    edificio:$('#f_edi').value.trim()||'1', switch:$('#f_sw').value.trim(), puerto:$('#f_port').value.trim(),
    ubicacion:$('#f_ubic').value.trim().toUpperCase(), piso:$('#f_piso').value.trim().toUpperCase(),
    etiqueta:$('#f_etiq').value.trim().toUpperCase(), regleta:$('#f_reg').value.trim().toUpperCase(),
    estado:$('#f_estado').value, obs:$('#f_obs').value.trim()||'NINGUNA'
  };
  if(!rec.switch||!rec.puerto){ toast('Indica al menos Switch y Puerto'); return; }
  if(state.editId){ const r=state.records.find(x=>x.id===state.editId); Object.assign(r,rec); toast('Punto actualizado'); }
  else { rec.id=state.nextId++; state.records.push(rec); 
         if(!swList().some(s=>s.switch===rec.switch)) state.switches.push({edificio:rec.edificio,switch:rec.switch,puertos:+rec.puerto||24});
         toast('Punto agregado'); }
  persist(); renderFilters(); render(); closeModal();
}
function delRec(id){ const r=state.records.find(x=>x.id===id); if(!confirm(`¿Eliminar el punto ${r.switch}/${r.puerto} (${r.etiqueta||'sin etiqueta'})?`))return; state.records=state.records.filter(x=>x.id!==id); persist(); renderFilters(); render(); toast('Punto eliminado'); }

/* ── Export to Excel (one sheet per switch, original format) ── */
function exportXlsx(){
  const wb=XLSX.utils.book_new();
  swList().forEach(s=>{
    const recs=state.records.filter(r=>r.switch===s.switch);
    const maxPort=Math.max(s.puertos||0, ...recs.map(r=>+r.puerto||0), 24);
    const byPort={}; recs.forEach(r=>byPort[+r.puerto]=r);
    const aoa=[];
    aoa.push(['TRIENERGY SAS  LISTADO DE PUNTOS DE RED  ']);
    aoa.push(['EDIFICIO : '+s.edificio+'                                                                                       SWITCH: '+s.switch]);
    aoa.push(COLS.map(c=>c[1]));
    for(let p=1;p<=maxPort;p++){ const r=byPort[p];
      aoa.push(r?[p,r.ubicacion,r.piso,r.etiqueta,r.regleta,r.estado,r.obs]:[p,'','','','','','']); }
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[{wch:7},{wch:42},{wch:12},{wch:26},{wch:24},{wch:11},{wch:34}];
    ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:6}},{s:{r:1,c:0},e:{r:1,c:6}}];
    XLSX.utils.book_append_sheet(wb,ws,'SWITCH '+s.switch);
  });
  const d=new Date(), pad=n=>String(n).padStart(2,'0');
  XLSX.writeFile(wb,`Puntos_Red_Trienergy_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.xlsx`);
  toast('Excel descargado');
}

async function resetAll(){
  if(!confirm('Esto descarta tus cambios y vuelve al listado original. ¿Continuar?'))return;
  try{ await window.storage.delete('trienergy_red_v1',false); }catch(e){}
  state.activeSw=null; await boot(); toast('Datos restaurados');
}

let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1900); }

$('#q').oninput=render;
$('#clear').onclick=()=>{$('#q').value='';render();$('#q').focus();};
$('#addBtn').onclick=()=>openModal(null);
$('#exportBtn').onclick=exportXlsx;
$('#resetBtn').onclick=resetAll;
$('#mclose').onclick=closeModal; $('#mcancel').onclick=closeModal;
$('#msave').onclick=save;
$('#ov').onclick=e=>{if(e.target===$('#ov'))closeModal();};
document.onkeydown=e=>{ if(e.key==='Escape')closeModal(); if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus();} };
boot();
</script>
